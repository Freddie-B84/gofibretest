<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watson Orchestrate Chat</title>
    
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'IBM Plex Sans', Arial, sans-serif;
            background: #f4f4f4;
        }

        /* Mobile-specific styles */
        @supports (height: 100dvh) {
            @media (max-width: 768px) {
                #root .WxOChatContainer.WxOChatReset.WxOChatStyles .WxOLiteMainContainer,
                #root .WxOChatContainer.WxOChatReset.WxOChatStyles .right-panel-content,
                #root .WxOChatContainer.WxOChatReset.WxOChatStyles .wxoLiteWrapper {
                    height: calc(100dvh - 40px);
                }
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        // Mobile device detection function
        function isMobileDevice() {
            let userAgent = navigator.userAgent.toLowerCase();
            let mobileRegex = /android|iphone|ipad|ipod|blackberry|windows phone/;
            let isMobileUA = mobileRegex.test(userAgent);
            let isSmallScreen = window.matchMedia("(max-width: 767px)").matches;
            let isUAMobile = navigator.userAgentData?.mobile;
            return isMobileUA || isSmallScreen || isUAMobile;
        }

        // Watson Orchestrate configuration
        window.wxOConfiguration = {
            orchestrationID: "95f3b39ecb0a4fd7b5f71872005ef2f5_99155f47-ac2f-4206-b7c0-bcaf4e8f3838",
            hostURL: "https://eu-gb.watson-orchestrate.cloud.ibm.com",
            rootElementID: "root",
            deploymentPlatform: "ibmcloud",
            crn: "crn:v1:bluemix:public:watsonx-orchestrate:eu-gb:a/95f3b39ecb0a4fd7b5f71872005ef2f5:99155f47-ac2f-4206-b7c0-bcaf4e8f3838::",
            chatOptions: {
                agentId: "97270877-6094-4943-abaa-87223db49749", 
                agentEnvironmentId: "263324b4-aaf5-496c-b6f3-b8aa39719722",
            }
        };

        // Add mobile layout configuration
        var isMobile = isMobileDevice();
        
        if (isMobile) {
            window.wxOConfiguration.layout = {
                form: "float",
                width: "100%",
                height: "100%"
            };
            console.log("Mobile detected - using float layout with 100% dimensions");
        } else {
            var popUpWidth = "" + (0.5 * document.documentElement.clientWidth) + "px";
            var popUpHeight = "" + (0.75 * document.documentElement.clientHeight) + "px";
            window.wxOConfiguration.layout = {
                width: popUpWidth,
                height: popUpHeight
            };
            console.log("Desktop detected - using popup window");
        }

        // Load Watson Orchestrate
        setTimeout(function () {
            const script = document.createElement('script');
            script.src = `${window.wxOConfiguration.hostURL}/wxochat/wxoLoader.js?embed=true`;
            script.addEventListener('load', function () {
                wxoLoader.init();
            });
            document.head.appendChild(script);
        }, 0);
    </script>
</body>
</html>
